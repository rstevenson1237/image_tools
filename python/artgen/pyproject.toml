[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artgen"
version = "0.9.0"
description = "Thin Python client for the artgen pixel-art pipeline: calls the artgen CLI with --json and returns dicts and Pillow images."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["Pillow>=9"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Source = "https://github.com/rstevenson1237/image_tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
