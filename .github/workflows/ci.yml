name: CI

# deploy.yml only runs on pushes to main, so without this nothing gates a pull
# request — a regression would surface as a failed deploy rather than a failed
# check on the PR that caused it.
on:
  pull_request:
  push:
    branches: [main]

# This workflow verifies; it must never be able to publish.
permissions:
  contents: read

# Unlike the deploy's `pages` group, a superseded run here is worth cancelling.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

      # artgen workspace packages (packages/*). The app steps above and the
      # Pages deploy don't depend on them, so they run as separate steps.
      - run: npm run check:packages

      - run: npm run test:packages

      # Package boundaries (docs/TOOLING-PLAN.md §6). Each package is one layer.
      - run: npm run lint:boundaries -- --strict

      # A branch can be type-clean and green on tests and still fail to build.
      # Use the same sub-path the deploy uses so this catches it on the PR.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

  # Consumer fixtures (docs/TOOLING-PLAN.md R4): every case of packages/artgen-cli/fixtures against the BUILD a game repo would
  # install, not the sources. The facts each case states are held by the fixture tests in `verify`.
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node packages/artgen-dist/build.mjs --no-ui

      - run: node scripts/artgen-consumer-ci.mjs

  # The Python client (python/artgen) runs the CLI from this repo's sources, so it needs the workspace installed.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - run: pip install -e 'python/artgen[test]'

      - run: python -m pytest python/artgen -q
