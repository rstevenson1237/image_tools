name: artgen-dist

# Publishes the artgen committed-install distribution (packages/artgen-dist → out/) to the `artgen-dist` branch,
# which game repos install from:
#   npx -y github:rstevenson1237/image_tools#artgen-dist init | update
# Releases (artgen-release.yml) publish the same way and tag the commit artgen-dist-v<version>.
# Runs only after the packages verify on main, so the branch never carries an untested build.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/artgen-dist.yml'
  workflow_dispatch:

# Pushing the branch needs write access to repository contents; nothing else.
permissions:
  contents: write

# Publishes must not interleave: each one commits on top of the previous branch head.
concurrency:
  group: artgen-dist
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check:packages

      # Includes the install smoke test (packages/artgen-dist/test): build, install into a scratch game repo,
      # run the CLI and MCP server from the installed files, and the update/edit-protection cases.
      - run: npm run test:packages

      - run: npm run build -w artgen-dist

      # the same publish step the release workflow uses (scripts/artgen-publish-dist.sh), without a tag
      - name: Commit the build to the artgen-dist branch
        run: scripts/artgen-publish-dist.sh packages/artgen-dist/out
