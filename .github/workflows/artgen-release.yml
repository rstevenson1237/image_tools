name: artgen-release

# An artgen release (PLAN P7). Prepare it with `node scripts/artgen-release.mjs <version>` (version bump in lockstep,
# CHANGELOG section), merge to main, then push the tag:
#   git tag -a artgen-v0.9.0 -m "artgen 0.9.0" && git push origin artgen-v0.9.0
# This workflow checks the tag against the version, runs the package and Python tests, publishes the build to the
# `artgen-dist` branch, tags that commit `artgen-dist-v<version>` (what game repos pin:
# `npx -y github:rstevenson1237/image_tools#artgen-dist-v0.9.0 update`) and creates the GitHub release with the
# changelog section, the Python client's sdist/wheel and the library package files (artgen-runtime, artgen-primitives,
# artgen-scene, artgen-mapgen: `npm install <release url>/artgen-mapgen-<version>.tgz`, no registry) attached.
# PyPI is not published (on the owner's go-ahead only).
# Safe to run again for the same tag: a dist tag already published from the same commit is left as it is, and a
# release that already exists (one made by hand in the GitHub UI, which also pushes the tag) gets the changelog notes
# and the Python files instead of failing. To finish a release whose run failed, run this workflow by hand
# (Actions → artgen-release → Run workflow) with the tag: it runs the current workflow on that tag's commit.
# Optional (D4): set the repository variable ARTGEN_PUBLISH_RUNTIME=true and the NPM_TOKEN secret to also publish
# artgen-runtime to npm when its version is not there yet.
on:
  push:
    tags: ['artgen-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to (re)run, e.g. artgen-v0.11.0'
        required: true

permissions:
  contents: write

# shares the branch with artgen-dist.yml: publishes must not interleave
concurrency:
  group: artgen-dist
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # the release tag: the pushed one, or the one given to a manual run
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tag matches the version
        id: v
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/artgen-dist/package.json').version")
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' python/artgen/pyproject.toml)
          if [ "${TAG}" != "artgen-v${version}" ] || [ "$py" != "$version" ]; then
            echo "tag ${TAG} vs artgen-dist ${version} / python ${py}: run scripts/artgen-release.mjs first" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run check:packages

      - run: npm run test:packages

      - name: Python client tests
        run: |
          pip install -e 'python/artgen[test]' build
          python -m pytest python/artgen -q

      - run: npm run build -w artgen-dist

      # Consumer CI (docs/TOOLING-PLAN.md R4): every fixture against the candidate build. A regression stops the release here,
      # before anything is published.
      - name: Consumer fixtures against the candidate build
        run: node scripts/artgen-consumer-ci.mjs --dist packages/artgen-dist/out

      # the library package files, named like the ones packages.json in the distribution lists (the installer's `update`
      # moves a consumer's release URLs to them)
      - name: Library package files
        run: |
          set -euo pipefail
          node packages/artgen-dist/pack-libs.mjs lib-dist --release "${{ steps.v.outputs.version }}"
          for f in $(node -p "Object.values(require('./packages/artgen-dist/out/dist/packages.json').packages).map(p => p.file).join(' ')"); do
            test -f "lib-dist/$f" || { echo "lib-dist/$f is missing" >&2; exit 1; }
          done

      - name: Publish the artgen-dist branch and tag the release
        run: scripts/artgen-publish-dist.sh packages/artgen-dist/out "artgen-dist-v${{ steps.v.outputs.version }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${{ steps.v.outputs.version }}
          # this release's section of the changelog
          awk -v v="## ${version} " 'index($0, v) == 1 { on = 1; print; next } /^## / { on = 0 } on' packages/artgen-dist/CHANGELOG.md > notes.md
          printf '\nInstall or update in a game repo (modules: core, art, maps, ui, update-pr):\n\n    npx -y github:%s#artgen-dist-v%s init --with art,maps\n    npx -y github:%s#artgen-dist-v%s update\n' "$GITHUB_REPOSITORY" "$version" "$GITHUB_REPOSITORY" "$version" >> notes.md
          printf '\nLibrary packages for code that imports the engine (attached to this release):\n\n' >> notes.md
          for f in lib-dist/*.tgz; do printf '    npm install https://github.com/%s/releases/download/%s/%s\n' "$GITHUB_REPOSITORY" "$TAG" "$(basename "$f")" >> notes.md; done
          python -m build python/artgen --outdir python-dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            # made by hand (or by an earlier run): give it the changelog notes and the Python and library files
            gh release edit "$TAG" --title "artgen $version" --notes-file notes.md
            gh release upload "$TAG" python-dist/* lib-dist/* --clobber
          else
            gh release create "$TAG" --title "artgen $version" --notes-file notes.md python-dist/* lib-dist/*
          fi

  runtime-npm:
    needs: release
    if: vars.ARTGEN_PUBLISH_RUNTIME == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish artgen-runtime when its version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/artgen-runtime
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name"); version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is already on npm"; exit 0; fi
          # the workspace keeps it private (vendored by `artgen export --runtime`); the published copy is not
          npm pkg delete private
          npm publish --access public --provenance
